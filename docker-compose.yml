# Okulum Yeryüzü — API stack: postgres + clickhouse + api.
# Only the api joins the shared "web" network (Caddy reaches it there, internal port 3003).
# ClickHouse serves HTTP on 3004 (set via the clickhouse-http-port config below).
# Postgres and ClickHouse stay on the stack's private network; no ports are published.

name: okulumyeryuzu

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: okulumyeryuzu
      POSTGRES_USER: oy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oy -d okulumyeryuzu"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: oy
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
    configs:
      - source: clickhouse-http-port
        target: /etc/clickhouse-server/config.d/http-port.xml
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  oy-api:
    image: ${RUNARTECH_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:3003
      ConnectionStrings__Postgres: Host=postgres;Database=okulumyeryuzu;Username=oy;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY (min 32 chars)}
      Media__PublicBaseUrl: ${API_PUBLIC_URL:-https://service.okulumyeryuzu.com}
      Ui__Url: ${UI_INTERNAL_URL:-http://oy-ui:3000}
      Ui__RevalidateSecret: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      ClickHouse__Url: http://clickhouse:3004
      ClickHouse__User: oy
      ClickHouse__Password: ${CLICKHOUSE_PASSWORD}
      Cors__Origins__0: ${PANEL_PUBLIC_URL:?set PANEL_PUBLIC_URL}
      Cors__Origins__1: ${SITE_URL:-https://new.okulumyeryuzu.com}
      # Mobile app (Capacitor): iOS and Android web views.
      Cors__Origins__2: capacitor://localhost
      Cors__Origins__3: https://localhost
      # Push notifications: Firebase service account, copied into the storage volume once:
      #   docker compose cp firebase-server-key.json oy-api:/app/storage/firebase-server-key.json && docker compose restart oy-api
      Push__CredentialsPath: /app/storage/firebase-server-key.json
      # Media storage: DigitalOcean Spaces when SPACES_BUCKET/keys are set (RunarTech panel → Ortam değişkenleri),
      # otherwise the storage volume. Run `dotnet Oy.Api.dll storage-sync` once before switching.
      Storage__Spaces__Endpoint: ${SPACES_ENDPOINT:-https://fra1.digitaloceanspaces.com}
      Storage__Spaces__Region: ${SPACES_REGION:-fra1}
      Storage__Spaces__Bucket: ${SPACES_BUCKET:-}
      Storage__Spaces__AccessKey: ${SPACES_ACCESS_KEY:-}
      Storage__Spaces__SecretKey: ${SPACES_SECRET_KEY:-}
      Storage__Spaces__PublicBaseUrl: ${SPACES_PUBLIC_BASE_URL:-}
      Storage__Spaces__Prefix: ${SPACES_PREFIX:-}
      Seed__AdminEmail: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    volumes:
      - apidata:/app/storage
    healthcheck:
      # The aspnet image has no curl/wget; probe /health over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/3003 && printf ''GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 '''
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal
      - web

configs:
  clickhouse-http-port:
    content: |
      <clickhouse>
        <http_port>3004</http_port>
      </clickhouse>

networks:
  internal:
  web:
    external: true

volumes:
  pgdata:
  chdata:
  apidata:
